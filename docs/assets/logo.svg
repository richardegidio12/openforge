<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F5A623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9EA3A8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8CDD3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A0522D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CD7F32;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background: transparent -->

  <!-- Icon: data layers flowing into a forge point -->
  <!-- Bronze layer (raw, wide) -->
  <rect x="12" y="68" width="72" height="22" rx="4" fill="url(#bronzeGrad)" opacity="0.95"/>
  <!-- Silver layer (cleaned, medium) -->
  <rect x="20" y="43" width="56" height="18" rx="4" fill="url(#silverGrad)" opacity="0.95"/>
  <!-- Gold layer (serving, narrow, glowing) -->
  <rect x="28" y="22" width="40" height="14" rx="4" fill="url(#goldGrad)" filter="url(#glow)" opacity="1"/>

  <!-- Spark / flame above gold -->
  <path d="M44 20 Q48 10 52 8 Q50 15 54 14 Q51 20 48 22 Z" fill="#FFD700" opacity="0.85"/>
  <path d="M50 18 Q53 11 56 10 Q54 16 57 15 Q55 19 52 21 Z" fill="#FFF176" opacity="0.7"/>

  <!-- Connector lines (pipeline arrows) -->
  <line x1="48" y1="68" x2="48" y2="62" stroke="#666" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="48" y1="43" x2="48" y2="37" stroke="#888" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- "Open" text -->
  <text x="105" y="62"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="38"
        font-weight="300"
        letter-spacing="-0.5"
        fill="#1C1C2E">Open</text>

  <!-- "Forge" text (bold, gold accent) -->
  <text x="228" y="62"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="38"
        font-weight="700"
        letter-spacing="-0.5"
        fill="#1C1C2E">Forge</text>

  <!-- Gold underline accent on "Forge" -->
  <rect x="228" y="67" width="130" height="3" rx="1.5" fill="url(#goldGrad)"/>

  <!-- Tagline -->
  <text x="106" y="90"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="12"
        font-weight="400"
        fill="#666"
        letter-spacing="0.3">
    Open Framework for Orchestrated &amp; Reliable data-platform Engineering
  </text>
</svg>
