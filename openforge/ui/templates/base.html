<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}OpenForge{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .badge-pass  { background:#dcfce7; color:#166534; }
    .badge-fail  { background:#fee2e2; color:#991b1b; }
    .badge-warn  { background:#fef9c3; color:#854d0e; }
    .badge-none  { background:#f1f5f9; color:#475569; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Nav -->
  <nav class="bg-white border-b border-slate-200 px-6 py-3 flex items-center gap-3">
    <a href="/" class="flex items-center gap-2 font-bold text-blue-700 text-lg no-underline">
      ◆ OpenForge
    </a>
    <span class="text-slate-300">|</span>
    <span class="text-slate-500 text-sm font-medium">{{ project_name }}</span>
    <span class="ml-auto text-xs text-slate-400">v{{ version }}</span>
  </nav>

  <!-- Content -->
  <main class="max-w-6xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
