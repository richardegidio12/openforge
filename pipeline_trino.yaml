name: sales_trino_pipeline
version: "0.1.0"
description: "Pipeline that ingests sales data into a Trino/Hive catalog"

# Connector: Trino distributed SQL engine
# Test connection first: openforge connect trino --host localhost --catalog hive
connector:
  type: trino
  host: localhost
  port: 8080
  user: admin
  catalog: hive
  schema: analytics
  http_scheme: http
  # password: ""  # uncomment if auth is enabled

sources:
  - name: sales_raw
    type: csv
    path: sample_data/sales.csv

steps:
  - name: ingest_sales
    type: ingest
    source: sales_raw
    target: sales                 # → hive.analytics.sales

  - name: validate_sales
    type: quality
    table: sales
    rules:
      - column: order_id
        checks: [not_null, unique]
      - column: total_amount
        checks: [not_null]
        min_value: 0
      - column: order_date
        checks: [not_null]

  - name: document_sales
    type: docs
    table: sales
    use_llm: true
